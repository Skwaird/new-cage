<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ignis — Game Grid</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--space:#04060f;--ink:#eef2ff;--muted:#8590b8;--accent:#ff6b35;--accent-2:#ffb547;--line:rgba(255,255,255,.08)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Space Grotesk',sans-serif;background:var(--space);color:var(--ink);min-height:100vh;overflow-x:hidden}
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none}
  .star{position:absolute;width:1px;height:1px;background:#fff;border-radius:50%;opacity:.5}
  @keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.8}}
  header{position:relative;z-index:10;padding:16px 28px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);background:rgba(4,6,15,.7);backdrop-filter:blur(12px)}
  .header-left{display:flex;align-items:center;gap:16px}
  .back-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;background:transparent;border:1px solid var(--line);color:var(--muted);text-decoration:none;font-size:13px;transition:.2s}
  .back-btn:hover{border-color:var(--accent);color:var(--accent)}
  .planet-title{font-family:'Fraunces',serif;font-size:22px;font-weight:700}
  .planet-title .dot{color:var(--accent)}
  .grid-controls{display:flex;gap:8px;align-items:center}
  .grid-controls label{font-size:12px;color:var(--muted)}
  .grid-controls select{padding:6px 10px;border-radius:6px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--ink);font-family:inherit;font-size:12px}
  main{position:relative;z-index:5;padding:24px 28px;max-width:1400px;margin:0 auto}
  .page-title{font-family:'Fraunces',serif;font-size:clamp(28px,4vw,42px);font-weight:700;margin-bottom:6px}
  .page-sub{color:var(--muted);font-size:14px;margin-bottom:24px}
  .game-grid{display:grid;gap:16px}
  .game-grid.cols-2{grid-template-columns:repeat(2,1fr)}
  .game-grid.cols-3{grid-template-columns:repeat(3,1fr)}
  .game-grid.cols-4{grid-template-columns:repeat(4,1fr)}
  .game-card{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:.2s}
  .game-card:hover{border-color:var(--accent);transform:translateY(-3px)}
  .game-card-header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
  .game-name{font-size:13px;font-weight:600;color:var(--accent)}
  .game-actions{display:flex;gap:6px}
  .game-btn{padding:4px 8px;border-radius:5px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--muted);cursor:pointer;font-size:11px;text-decoration:none;transition:.2s}
  .game-btn:hover{color:var(--accent);border-color:var(--accent)}
  .game-iframe-wrap{position:relative;aspect-ratio:4/3;overflow:hidden;background:#000}
  .game-iframe-wrap iframe{width:100%;height:100%;border:none;display:block}
  .game-placeholder{display:grid;place-items:center;height:100%;color:var(--muted);font-size:13px;text-align:center;padding:20px}
  .add-game-card{display:grid;place-items:center;aspect-ratio:4/3;border:2px dashed var(--line);border-radius:14px;cursor:pointer;transition:.2s;color:var(--muted);font-size:14px}
  .add-game-card:hover{border-color:var(--accent);color:var(--accent)}
  .modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);display:none;place-items:center}
  .modal-overlay.show{display:grid}
  .modal{background:var(--space);border:1px solid var(--line);border-radius:16px;padding:28px;width:min(440px,90vw)}
  .modal h3{font-family:'Fraunces',serif;font-size:20px;margin-bottom:16px}
  .modal input{width:100%;padding:12px 14px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--ink);font-family:inherit;font-size:14px;margin-bottom:12px;outline:none}
  .modal input:focus{border-color:var(--accent)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end}
  .modal-btn{padding:10px 20px;border-radius:8px;border:none;cursor:pointer;font-family:inherit;font-weight:600;font-size:13px;transition:.2s}
  .modal-btn.cancel{background:transparent;border:1px solid var(--line);color:var(--muted)}
  .modal-btn.save{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#1a0d04}
  @media(max-width:700px){.game-grid.cols-3,.game-grid.cols-4{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="stars"></div>
<header>
  <div class="header-left">
    <a href="../index.html" class="back-btn">← Cosmos</a>
    <div class="planet-title">Ignis<span class="dot">.</span></div>
  </div>
  <div class="grid-controls">
    <label>Grid:</label>
    <select id="cols-select">
      <option value="2">2 columns</option>
      <option value="3" selected>3 columns</option>
      <option value="4">4 columns</option>
    </select>
  </div>
</header>
<main>
  <h1 class="page-title">Game Grid</h1>
  <p class="page-sub">A grid of playable games. Click any to play fullscreen. Add your own with the + button.</p>
  <div class="game-grid cols-3" id="grid">
    <div class="add-game-card" id="add-card">+ Add Game</div>
  </div>
</main>
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>Add a Game</h3>
    <input id="game-name-input" placeholder="Game name (e.g. Snake)" />
    <input id="game-url-input" placeholder="Game URL or local path (e.g. games/snake.html)" />
    <div class="modal-actions">
      <button class="modal-btn cancel" id="modal-cancel">Cancel</button>
      <button class="modal-btn save" id="modal-save">Add</button>
    </div>
  </div>
</div>
<script>
  (function(){for(let i=0;i<150;i++){const s=document.createElement('div');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animation=`twinkle ${2+Math.random()*4}s infinite ${Math.random()*4}s`;document.getElementById('stars').appendChild(s)}})();

  // Default games — replace URLs with your own or local HTML5 game files
  let games = [
    {name:'2048', url:'https://mgarciaisaia.github.io/2048/'},
    {name:'Chess', url:'https://play.chessbase.com'},
    {name:'Tetris', url:'https://tetris.com/play-tetris'},
    {name:'People Playground', url:'Games/people-playground.html'},
  ];

  const grid = document.getElementById('grid');
  const addCard = document.getElementById('add-card');
  const modal = document.getElementById('modal');
  const nameInput = document.getElementById('game-name-input');
  const urlInput = document.getElementById('game-url-input');

  function render(){
    // Remove all except add-card
    [...grid.querySelectorAll('.game-card')].forEach(c=>c.remove());
    games.forEach((g,i)=>{
      const card = document.createElement('div');
      card.className = 'game-card';
      card.innerHTML = `
        <div class="game-card-header">
          <span class="game-name">${g.name}</span>
          <div class="game-actions">
            <button class="game-btn" data-fullscreen="${i}" title="Fullscreen">⛶</button>
            <button class="game-btn" data-remove="${i}">✕</button>
          </div>
        </div>
        <div class="game-iframe-wrap">
          <iframe src="${g.url}" loading="lazy" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
        </div>
      `;
      grid.insertBefore(card, addCard);
    });
    // Wire remove buttons
    grid.querySelectorAll('[data-remove]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        games.splice(parseInt(btn.dataset.remove),1);
        render();
      });
    });
    // Wire fullscreen buttons
    grid.querySelectorAll('[data-fullscreen]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const card = btn.closest('.game-card');
        const iframe = card.querySelector('iframe');
        requestFullscreenOn(iframe);
      });
    });
  }

  function requestFullscreenOn(el){
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if(req){
      req.call(el).catch(()=>{
        // Some cross-origin iframes block fullscreen from the parent;
        // fall back to opening the game in a new tab.
        window.open(el.src, '_blank');
      });
    } else {
      window.open(el.src, '_blank');
    }
  }

  addCard.addEventListener('click',()=>{
    nameInput.value=''; urlInput.value='';
    modal.classList.add('show');
    nameInput.focus();
  });
  document.getElementById('modal-cancel').addEventListener('click',()=>modal.classList.remove('show'));
  document.getElementById('modal-save').addEventListener('click',()=>{
    const n=nameInput.value.trim(), u=urlInput.value.trim();
    if(n&&u){games.push({name:n,url:u});render();modal.classList.remove('show');}
  });

  document.getElementById('cols-select').addEventListener('change',e=>{
    grid.className = 'game-grid cols-'+e.target.value;
  });

  render();
</script>
</body>
</html>
