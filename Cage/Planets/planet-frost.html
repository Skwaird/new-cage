<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frost — Drawing Canvas</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--space:#04060f;--ink:#eef2ff;--muted:#8590b8;--accent:#80deea;--accent-2:#b2ebf2;--line:rgba(255,255,255,.08)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Space Grotesk',sans-serif;background:var(--space);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none}
  .star{position:absolute;width:1px;height:1px;background:#fff;border-radius:50%;opacity:.4}
  @keyframes twinkle{0%,100%{opacity:.1}50%{opacity:.5}}
  header{position:relative;z-index:10;padding:14px 28px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);background:rgba(4,6,15,.7);backdrop-filter:blur(12px)}
  .header-left{display:flex;align-items:center;gap:16px}
  .back-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;background:transparent;border:1px solid var(--line);color:var(--muted);text-decoration:none;font-size:13px;transition:.2s}
  .back-btn:hover{border-color:var(--accent);color:var(--accent)}
  .planet-title{font-family:'Fraunces',serif;font-size:22px;font-weight:700}
  .planet-title .dot{color:var(--accent)}
  .toolbar{position:relative;z-index:10;padding:12px 28px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);background:rgba(4,6,15,.5)}
  .tool-group{display:flex;gap:6px;align-items:center}
  .tool-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-right:4px}
  .tool-btn{width:38px;height:38px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--ink);cursor:pointer;display:grid;place-items:center;font-size:16px;transition:.2s}
  .tool-btn:hover{border-color:var(--accent)}
  .tool-btn.active{background:rgba(128,222,234,.15);border-color:var(--accent);color:var(--accent)}
  .color-swatch{width:28px;height:28px;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:.2s}
  .color-swatch:hover{transform:scale(1.1)}
  .color-swatch.active{border-color:#fff;transform:scale(1.15)}
  .color-picker-wrap{display:flex;align-items:center;gap:6px}
  input[type="color"]{width:38px;height:38px;border:none;border-radius:8px;cursor:pointer;background:transparent}
  input[type="color"]::-webkit-color-swatch{border:1px solid var(--line);border-radius:8px}
  input[type="range"]{width:100px;accent-color:var(--accent)}
  .size-display{font-size:12px;color:var(--muted);min-width:30px}
  .spacer{flex:1}
  .action-btn{padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;transition:.2s;display:flex;align-items:center;gap:6px}
  .action-btn:hover{border-color:var(--accent);color:var(--accent)}
  .action-btn.save{background:linear-gradient(135deg,var(--accent),#4a6fa5);border:none;color:#04060f}
  .action-btn.save:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(128,222,234,.3)}
  #canvas-wrap{position:relative;z-index:5;flex:1;display:grid;place-items:center;overflow:auto;padding:20px}
  #canvas{background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);cursor:crosshair;max-width:100%;max-height:100%}
  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:10px;background:rgba(128,222,234,.15);border:1px solid var(--accent);color:var(--accent);font-size:13px;font-weight:600;z-index:100;opacity:0;transition:.3s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-10px)}
  @media(max-width:700px){.toolbar{padding:8px 12px;gap:8px}.tool-label{display:none}}
</style>
</head>
<body>
<div id="stars"></div>
<header>
  <div class="header-left">
    <a href="../index.html" class="back-btn">← Cosmos</a>
    <div class="planet-title">Frost<span class="dot">.</span></div>
  </div>
</header>
<div class="toolbar">
  <div class="tool-group">
    <span class="tool-label">Tool</span>
    <button class="tool-btn active" data-tool="brush" title="Brush">🖌</button>
    <button class="tool-btn" data-tool="line" title="Line">╱</button>
    <button class="tool-btn" data-tool="rect" title="Rectangle">▭</button>
    <button class="tool-btn" data-tool="circle" title="Circle">○</button>
    <button class="tool-btn" data-tool="eraser" title="Eraser">⌫</button>
  </div>
  <div class="tool-group">
    <span class="tool-label">Color</span>
    <div class="color-swatch active" style="background:#000" data-color="#000000"></div>
    <div class="color-swatch" style="background:#fff" data-color="#ffffff"></div>
    <div class="color-swatch" style="background:#ff6b6b" data-color="#ff6b6b"></div>
    <div class="color-swatch" style="background:#4d8dff" data-color="#4d8dff"></div>
    <div class="color-swatch" style="background:#3ddc97" data-color="#3ddc97"></div>
    <div class="color-swatch" style="background:#ffb547" data-color="#ffb547"></div>
    <div class="color-swatch" style="background:#a78bfa" data-color="#a78bfa"></div>
    <div class="color-picker-wrap">
      <input type="color" id="custom-color" value="#000000" title="Custom color" />
    </div>
  </div>
  <div class="tool-group">
    <span class="tool-label">Size</span>
    <input type="range" id="size-slider" min="1" max="60" value="4" />
    <span class="size-display" id="size-display">4px</span>
  </div>
  <div class="spacer"></div>
  <button class="action-btn" id="undo-btn">↶ Undo</button>
  <button class="action-btn" id="clear-btn">🗑 Clear</button>
  <button class="action-btn save" id="save-btn">⬇ Save PNG</button>
</div>
<div id="canvas-wrap">
  <canvas id="canvas" width="1000" height="650"></canvas>
</div>
<div class="toast" id="toast">Saved!</div>
<script>
  (function(){for(let i=0;i<120;i++){const s=document.createElement('div');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animation=`twinkle ${2+Math.random()*4}s infinite ${Math.random()*4}s`;document.getElementById('stars').appendChild(s)}})();

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const toast = document.getElementById('toast');

  let tool = 'brush';
  let color = '#000000';
  let size = 4;
  let drawing = false;
  let startX = 0, startY = 0;
  let snapshot = null;
  let history = [];
  const MAX_HISTORY = 30;

  // Fill white background
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  saveHistory();

  function saveHistory(){
    if(history.length >= MAX_HISTORY) history.shift();
    history.push(canvas.toDataURL());
  }

  function undo(){
    if(history.length <= 1) return;
    history.pop();
    const img = new Image();
    img.onload = ()=>{
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img, 0, 0);
    };
    img.src = history[history.length-1];
  }

  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const x = (e.clientX - rect.left) * scaleX;
    const y = (e.clientY - rect.top) * scaleY;
    return {x, y};
  }

  canvas.addEventListener('mousedown', e=>{
    drawing = true;
    const {x,y} = getPos(e);
    startX = x; startY = y;
    snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);

    if(tool === 'brush' || tool === 'eraser'){
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = size;
      ctx.strokeStyle = tool === 'eraser' ? '#ffffff' : color;
      ctx.lineTo(x + 0.1, y + 0.1);
      ctx.stroke();
    }
  });

  canvas.addEventListener('mousemove', e=>{
    if(!drawing) return;
    const {x,y} = getPos(e);

    if(tool === 'brush' || tool === 'eraser'){
      ctx.lineTo(x, y);
      ctx.stroke();
    } else {
      // Restore snapshot for shape preview
      ctx.putImageData(snapshot, 0, 0);
      ctx.strokeStyle = color;
      ctx.lineWidth = size;
      ctx.beginPath();

      if(tool === 'line'){
        ctx.moveTo(startX, startY);
        ctx.lineTo(x, y);
        ctx.stroke();
      } else if(tool === 'rect'){
        ctx.strokeRect(startX, startY, x - startX, y - startY);
      } else if(tool === 'circle'){
        const r = Math.hypot(x - startX, y - startY);
        ctx.arc(startX, startY, Math.max(1, r), 0, Math.PI * 2);
        ctx.stroke();
      }
    }
  });

  canvas.addEventListener('mouseup', ()=>{
    if(drawing){
      drawing = false;
      saveHistory();
    }
  });
  canvas.addEventListener('mouseleave', ()=>{
    if(drawing){
      drawing = false;
      saveHistory();
    }
  });

  // Touch support
  canvas.addEventListener('touchstart', e=>{
    e.preventDefault();
    const t = e.touches[0];
    canvas.dispatchEvent(new MouseEvent('mousedown', {clientX:t.clientX, clientY:t.clientY}));
  });
  canvas.addEventListener('touchmove', e=>{
    e.preventDefault();
    const t = e.touches[0];
    canvas.dispatchEvent(new MouseEvent('mousemove', {clientX:t.clientX, clientY:t.clientY}));
  });
  canvas.addEventListener('touchend', e=>{
    e.preventDefault();
    canvas.dispatchEvent(new MouseEvent('mouseup', {}));
  });

  // Tool selection
  document.querySelectorAll('[data-tool]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('[data-tool]').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      tool = btn.dataset.tool;
      canvas.style.cursor = tool === 'eraser' ? 'cell' : 'crosshair';
    });
  });

  // Color swatches
  document.querySelectorAll('.color-swatch').forEach(sw=>{
    sw.addEventListener('click', ()=>{
      document.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('active'));
      sw.classList.add('active');
      color = sw.dataset.color;
      document.getElementById('custom-color').value = color;
    });
  });

  // Custom color picker
  document.getElementById('custom-color').addEventListener('input', e=>{
    color = e.target.value;
    document.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('active'));
  });

  // Size slider
  const sizeSlider = document.getElementById('size-slider');
  const sizeDisplay = document.getElementById('size-display');
  sizeSlider.addEventListener('input', e=>{
    size = parseInt(e.target.value);
    sizeDisplay.textContent = size + 'px';
  });

  // Undo
  document.getElementById('undo-btn').addEventListener('click', undo);

  // Clear
  document.getElementById('clear-btn').addEventListener('click', ()=>{
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    saveHistory();
  });

  // Save as PNG
  document.getElementById('save-btn').addEventListener('click', ()=>{
    const link = document.createElement('a');
    link.download = 'frost-artwork-' + Date.now() + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    toast.classList.add('show');
    setTimeout(()=> toast.classList.remove('show'), 2000);
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', e=>{
    if(e.ctrlKey && e.key === 'z'){ e.preventDefault(); undo(); }
    if(e.ctrlKey && e.key === 's'){ e.preventDefault(); document.getElementById('save-btn').click(); }
  });
</script>
</body>
</html>
