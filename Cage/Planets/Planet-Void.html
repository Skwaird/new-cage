<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Void — Chatroom at the Edge of the Universe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --space:#04060f;
    --space-2:#0a0f22;
    --ink:#eef2ff;
    --muted:#8590b8;
    --accent:#a78bfa;
    --accent-2:#c4b5fd;
    --line:rgba(255,255,255,.08);
    --void-glow:rgba(120,90,255,.15);
    --warn:#ff6b6b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:'Space Grotesk',sans-serif;
    background:var(--space);color:var(--ink);
    display:flex;flex-direction:column;
  }

  #stars{position:fixed;inset:0;z-index:0;pointer-events:none}
  .star{position:absolute;background:#fff;border-radius:50%;opacity:.7}
  @keyframes twinkle{0%,100%{opacity:.15}50%{opacity:1}}
  .star.s2{width:1px;height:1px}
  .star.s3{width:3px;height:3px;box-shadow:0 0 6px #fff}

  #void-planet{
    position:fixed;top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:600px;height:600px;border-radius:50%;
    background:
      radial-gradient(circle at 35% 30%, #2a2a4e 0%, transparent 30%),
      radial-gradient(circle at 70% 70%, #0a0a1a 0%, transparent 50%),
      linear-gradient(135deg, #1c1c34, #050510);
    box-shadow:inset -60px -40px 120px rgba(0,0,0,.9), 0 0 200px var(--void-glow);
    z-index:0;pointer-events:none;opacity:.4;
  }
  #void-rings{
    position:fixed;top:50%;left:50%;
    transform:translate(-50%,-50%) rotate(-18deg);
    width:900px;height:220px;border-radius:50%;
    border:20px solid rgba(167,139,250,.08);
    border-top-color:transparent;
    z-index:0;pointer-events:none;
  }

  header{
    position:relative;z-index:10;
    flex:0 0 auto;
    padding:16px 28px;
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--line);
    background:rgba(4,6,15,.6);
    backdrop-filter:blur(12px);
  }
  .header-left{display:flex;align-items:center;gap:16px}
  .back-btn{
    display:flex;align-items:center;gap:6px;
    padding:8px 14px;border-radius:8px;
    background:transparent;border:1px solid var(--line);
    color:var(--muted);text-decoration:none;font-size:13px;font-weight:500;
    transition:.2s;cursor:pointer;
  }
  .back-btn:hover{border-color:var(--accent);color:var(--accent)}
  .void-title{
    font-family:'Fraunces',serif;font-size:22px;font-weight:700;
    letter-spacing:-.01em;
  }
  .void-title .dot{color:var(--accent)}
  .header-right{display:flex;align-items:center;gap:12px}
  .status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .status-dot{
    width:7px;height:7px;border-radius:50%;
    background:#3ddc97;box-shadow:0 0 8px #3ddc97;
    animation:pulse 2s infinite;
  }
  .status-dot.off{background:#ff6b6b;box-shadow:0 0 8px #ff6b6b;animation:none}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  .username-badge{
    display:flex;align-items:center;gap:8px;
    padding:6px 12px;border-radius:8px;
    background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.25);
    font-size:13px;
  }
  .username-badge .label{color:var(--muted);font-size:11px}
  .username-badge .name{color:var(--accent);font-weight:600;font-family:'Fraunces',serif}
  .username-badge.locked .name{color:var(--accent-2)}
  .regen-btn{
    background:none;border:none;color:var(--muted);cursor:pointer;
    font-size:14px;padding:2px 4px;transition:.2s;
  }
  .regen-btn:hover{color:var(--accent)}
  .regen-btn.hidden{display:none}
  .lock-icon{font-size:11px;color:var(--muted);display:none}
  .username-badge.locked .lock-icon{display:inline}

  #chat{
    position:relative;z-index:5;
    flex:1 1 0;min-height:0;
    overflow-y:auto;
    padding:24px 28px;
    display:flex;flex-direction:column;gap:14px;
    scrollbar-width:thin;
    scrollbar-color:var(--line) transparent;
  }
  #chat::-webkit-scrollbar{width:6px}
  #chat::-webkit-scrollbar-track{background:transparent}
  #chat::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

  .msg{
    max-width:75%;
    padding:12px 18px;
    border-radius:14px;
    background:rgba(255,255,255,.04);
    border:1px solid var(--line);
    backdrop-filter:blur(8px);
    animation:msgIn .4s cubic-bezier(.2,.8,.2,1);
    word-wrap:break-word;overflow-wrap:break-word;
  }
  @keyframes msgIn{
    from{opacity:0;transform:translateY(12px) scale(.97)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }
  .msg-header{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
  .msg-user{font-family:'Fraunces',serif;font-weight:600;font-size:14px;color:var(--accent)}
  .msg-time{font-size:11px;color:var(--muted)}
  .msg-text{font-size:14px;line-height:1.5;color:var(--ink)}

  .msg.self{
    align-self:flex-end;
    background:rgba(167,139,250,.08);
    border-color:rgba(167,139,250,.2);
  }
  .msg.self .msg-user{color:var(--accent-2)}

  .msg.system{
    align-self:center;
    background:transparent;border:none;
    text-align:center;color:var(--muted);font-size:12px;
    font-style:italic;padding:4px;
  }

  .msg.blocked{
    align-self:center;
    background:rgba(255,107,107,.06);
    border:1px solid rgba(255,107,107,.15);
    color:var(--warn);font-size:12px;
    font-style:italic;padding:8px 16px;
  }

  .typing-indicator{
    align-self:flex-start;
    padding:10px 16px;border-radius:14px;
    background:rgba(255,255,255,.04);border:1px solid var(--line);
    display:none;align-items:center;gap:4px;
  }
  .typing-indicator.show{display:flex}
  .typing-dot{
    width:6px;height:6px;border-radius:50%;background:var(--muted);
    animation:typingBounce 1.4s infinite;
  }
  .typing-dot:nth-child(2){animation-delay:.2s}
  .typing-dot:nth-child(3){animation-delay:.4s}
  @keyframes typingBounce{
    0%,60%,100%{transform:translateY(0);opacity:.4}
    30%{transform:translateY(-6px);opacity:1}
  }

  .input-bar{
    position:relative;z-index:10;
    flex:0 0 auto;
    padding:16px 28px;
    border-top:1px solid var(--line);
    background:rgba(4,6,15,.7);
    backdrop-filter:blur(12px);
  }
  .input-wrap{display:flex;gap:12px;align-items:flex-end;max-width:800px;margin:0 auto}
  #msg-input{
    flex:1;
    padding:14px 18px;
    border-radius:12px;
    background:rgba(255,255,255,.04);
    border:1px solid var(--line);
    color:var(--ink);font-family:inherit;font-size:14px;
    resize:none;outline:none;
    transition:border-color .2s;
    max-height:120px;min-height:48px;
    line-height:1.5;
  }
  #msg-input:focus{border-color:var(--accent)}
  #msg-input::placeholder{color:var(--muted)}
  #msg-input.blocked-flash{border-color:var(--warn);animation:shake .4s}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-6px)}
    75%{transform:translateX(6px)}
  }
  #send-btn{
    flex:0 0 auto;
    padding:14px 24px;border-radius:12px;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),#7c3aed);
    color:#fff;font-family:inherit;font-weight:600;font-size:14px;
    transition:.2s;
    display:flex;align-items:center;gap:8px;
  }
  #send-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(167,139,250,.3)}
  #send-btn:active{transform:translateY(0)}
  #send-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}

  .empty-state{text-align:center;margin:auto;padding:40px;color:var(--muted)}
  .empty-state h3{font-family:'Fraunces',serif;font-size:24px;font-weight:600;color:var(--ink);margin-bottom:8px}
  .empty-state p{font-size:14px;max-width:360px;margin:0 auto}

  @media(max-width:600px){
    header{padding:12px 16px;flex-wrap:wrap;gap:8px}
    .void-title{font-size:18px}
    .username-badge{font-size:11px;padding:4px 8px}
    #chat{padding:16px}
    .msg{max-width:90%}
    .input-bar{padding:12px 16px}
    #void-planet{width:400px;height:400px}
    #void-rings{width:600px;height:150px}
  }
</style>
</head>
<body>

<div id="stars"></div>
<div id="void-planet"></div>
<div id="void-rings"></div>

<header>
  <div class="header-left">
    <a href="../index.html" class="back-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      Cosmos
    </a>
    <div class="void-title">Void<span class="dot">.</span></div>
  </div>
  <div class="header-right">
    <div class="status">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Connecting…</span>
    </div>
    <div class="username-badge" id="username-badge">
      <span class="label">You are</span>
      <span class="name" id="username">…</span>
      <button class="regen-btn" id="regen" title="New identity">↻</button>
      <span class="lock-icon" title="Locked after first message">🔒</span>
    </div>
  </div>
</header>

<div id="chat">
  <div class="empty-state" id="empty-state">
    <h3>The Void is silent.</h3>
    <p>You are alone at the edge of the universe. For now. Say something — someone may be listening.</p>
  </div>
  <div class="typing-indicator" id="typing">
    <div class="typing-dot"></div>
    <div class="typing-dot"></div>
    <div class="typing-dot"></div>
  </div>
</div>

<div class="input-bar">
  <div class="input-wrap">
    <textarea id="msg-input" placeholder="Whisper into the Void…" rows="1" maxlength="500"></textarea>
    <button id="send-btn" disabled>
      Send
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </div>
</div>

<script>
  /* ===== Starfield ===== */
  (function makeStars(){
    const layer = document.getElementById('stars');
    for(let i=0;i<260;i++){
      const s = document.createElement('div');
      s.className = 'star ' + (['s2','s2','s2','s3',''][i%5]);
      s.style.width = s.style.height = (i%5===3 ? '3px' : i%5===0 ? '2px' : '1px');
      s.style.left = Math.random()*100 + '%';
      s.style.top = Math.random()*100 + '%';
      s.style.animation = `twinkle ${2+Math.random()*4}s infinite ${Math.random()*4}s`;
      layer.appendChild(s);
    }
  })();

  /* ===== Username generation ===== */
  const adjectives = [
    "Cosmic","Stellar","Nebular","Quantum","Void","Dark","Radiant","Eternal",
    "Silent","Drifting","Ancient","Frozen","Burning","Hidden","Distant","Flickering",
    "Vast","Endless","Crimson","Azure","Lunar","Solar","Pulsar","Quasar",
    "Astral","Celestial","Obsidian","Phantom","Hollow","Shattered","Wandering","Forgotten"
  ];
  const nouns = [
    "Wanderer","Voyager","Pilgrim","Drifter","Seeker","Watcher","Dreamer","Traveler",
    "Nomad","Phantom","Specter","Echo","Shade","Spark","Fragment","Mote",
    "Whisper","Pulse","Beacon","Comet","Nova","Orbit","Tide","Current",
    "Drift","Glimmer","Shard","Moth","Signal","Trace","Vessel","Remnant"
  ];

  function generateUsername(){
    const adj = adjectives[Math.floor(Math.random()*adjectives.length)];
    const noun = nouns[Math.floor(Math.random()*nouns.length)];
    const num = Math.floor(Math.random()*99)+1;
    return `${adj}${noun}${num}`;
  }

  let myUsername = generateUsername();
  let hasChatted = false;
  const usernameBadge = document.getElementById('username-badge');
  const usernameEl = document.getElementById('username');
  const regenBtn = document.getElementById('regen');

  usernameEl.textContent = myUsername;

  regenBtn.addEventListener('click', ()=>{
    if(hasChatted) return;
    myUsername = generateUsername();
    usernameEl.textContent = myUsername;
  });

  function lockUsername(){
    if(hasChatted) return;
    hasChatted = true;
    usernameBadge.classList.add('locked');
    regenBtn.classList.add('hidden');
  }

  /* ===== Profanity & content filter ===== */
  const blockedWords = [
    // Racial slurs
    'nigger','nigga','n1gger','n1gga','n!gger','n!gga','nlgger','nlgga',
    'spic','sp1c','sp!c','chink','ch1nk','ch!nk','kike','k1ke','k!ke',
    'wetback','w3tback','gook','g00k','g0ok','towelhead','towel head',
    'junglebunny','jungle bunny','porchmonkey','porch monkey','sandnigger','sand nigger',
    'raghead','rag head','wop','w0p','mick','m!ck','ginzo','g!nzo',
    // Homophobic slurs
    'faggot','fag','f4ggot','f4g','f@ggot','f@g','f4gg0t','f4gg07',
    'dyke','d1ke','d!ke','carpetmuncher','carpet muncher',
    // Transphobic slurs
    'tranny','tr4nny','tr@nny','tr4nn1e','shemale','sh3male','sh3ma1e',
    'attackhelicopter','attack helicopter','transvestite','transv3stite',
    // Pedophilia / MAP
    'pedophile','paedophile','pedo','p3do','p3d0','pedobear','p3dobear',
    'minorattractedperson','map','nomap','pro-c','pro c',
    // Zoophilia
    'zoophile','z00phile','z0ophile','zooph1le','bestiality','beastiality',
    'b3stiality','beast1ality','dogfucker','dog fucker','animalfucker',
    // Hardcore swears
    'fuck','fucker','fucking','f*ck','f**k','fuk','fukkin','fuking',
    'motherfucker','motherf**ker','motherfuker','motherfuck','motherfuk',
    'shit','shitter','shitting','sh1t','sh!t','sh*t','bullshit','bullsh1t',
    'bitch','b1tch','b!tch','b*tch','bitches','b1tches',
    'asshole','@sshole','@ss','a$$hole','arsehole','arseshole',
    'cunt','c*nt','c1nt','c!nt','twat','tw4t','tw@t',
    'dick','d1ck','d!ck','d*ck','dickhead','d1ckhead',
    'cock','c0ck','c@ck','cocksucker','c0cksucker',
    'pussy','p*ssy','pussies','pus$y','pu$$y',
    'whore','wh0re','wh@re','slut','sl*t','s1ut','skank','sk*nk',
    'bastard','b@stard','b4stard','bitchass','b1tchass',
    'goddamn','goddam','god damn','g0ddamn',
    'damn','d4mn','d@mn',
    'hell','h3ll','h@ll',
    'piss','p1ss','p!ss','p*ss','pissed','p1ssed',
    'crap','cr4p','cr@p',
    // Ableist
    'retard','retarded','r3tard','r3tarded','r*tard','ret@rd','ret@rded',
    'spastic','sp4stic','spaz','sp4z','mong','m0ng','m0ngoloid','mongoloid',
    'lame','l4me','cripple','cr1pple','cr*pple',
    // Additional toxicity
    'rape','r4pe','r@pe','rapist','r4pist','r@p1st',
    'nazi','n4zi','n@zi','hitler','h1tler','h!tler',
    'terrorist','t3rrorist','t3rr0rist',
    'incel','1ncel','inc3l','simp','s1mp','s*mp',
    'thot','th0t','th@t','hoe','h0e','h@e',
    'fag','f4g','f@g','f@ggot',
  ];

  // Regex to detect website links
  const urlRegex = /(https?:\/\/[^\s]+)|(www\.[^\s]+)|([a-z0-9-]+\.(?:com|net|org|io|co|gg|dev|xyz|me|tv|info|biz|us|uk|ca|au|de|fr|jp|cn|ru|br|in|it|es|nl|se|no|fi|dk|ch|at|be|cz|pl|gr|pt|ie|nz|za|kr|tw|hk|sg|my|th|id|ph|vn|il|ae|sa|eg|ng|ke|ar|mx|cl|co|pe|ve|uy|ec|cr|gt|pa|do|cu|py|bo|hn|ni|sv|ht|edu|gov|mil|int|museum|travel|jobs|pro|name|cat|asia|mobi|tel|aero|coop|info|biz|ws|cc|tk|ml|ga|cf|gq|ly|sh|fm|am|dj|st|to|vu|nu|ms|gs|tk|tl|mn|ps|ir|iq|sy|lb|jo|ye|om|kw|bh|qa|ae|sa|td|km|sc|mu|re|yt|tf|pf|nc|wf|pm|bl|mf|sj|ac|ta|cx|cc|hm|bv|pn|sj|um|io|sh|ac|eu)\b)/gi;

  function normalizeText(text){
    // Convert to lowercase for matching
    let normalized = text.toLowerCase();
    // Replace common leetspeak substitutions
    normalized = normalized
      .replace(/0/g,'o')
      .replace(/1/g,'i')
      .replace(/3/g,'e')
      .replace(/4/g,'a')
      .replace(/5/g,'s')
      .replace(/7/g,'t')
      .replace(/8/g,'ate')
      .replace(/@/g,'a')
      .replace(/\$/g,'s')
      .replace(/!/g,'i')
      .replace(/\*/g,'')
      .replace(/\+/g,'t');
    return normalized;
  }

  function findBlockedContent(text){
    const normalized = normalizeText(text);
    const lower = text.toLowerCase();

    // Check for URLs
    if(urlRegex.test(text)){
      return 'website link';
    }
    // Reset regex lastIndex
    urlRegex.lastIndex = 0;

    // Check for blocked words
    for(const word of blockedWords){
      // Check both original and normalized
      if(lower.includes(word) || normalized.includes(word)){
        return word;
      }
    }

    // Check for @mentions or #hashtags that could be used to share links
    if(/@[a-z0-9._]+/i.test(text) && /\.[a-z]{2,}/i.test(text)){
      return 'possible link';
    }

    return null;
  }

  /* ===== Chat via ntfy.sh ===== */
  const TOPIC = 'cosmos-void-chatroom-2025';
  const chat = document.getElementById('chat');
  const emptyState = document.getElementById('empty-state');
  const input = document.getElementById('msg-input');
  const sendBtn = document.getElementById('send-btn');
  const statusDot = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');
  const typing = document.getElementById('typing');

  let ws = null;
  let connected = false;
  let typingTimeout = null;

  function connect(){
    statusText.textContent = 'Connecting…';
    statusDot.classList.add('off');

    ws = new WebSocket(`wss://ntfy.sh/${TOPIC}/ws?since=10m`);

    ws.onopen = ()=>{
      connected = true;
      statusDot.classList.remove('off');
      statusText.textContent = 'Connected to the Void';
      sendBtn.disabled = false;
      addSystemMessage('You have entered the Void.');
    };

    ws.onmessage = (event)=>{
      try {
        const data = JSON.parse(event.data);
        if(data.event !== 'message' || !data.message) return;

        const payload = JSON.parse(data.message);
        if(!payload.user || !payload.text) return;

        if(payload.type === 'typing'){
          showTyping(payload.user);
          return;
        }

        hideTyping();
        addMessage(payload.user, payload.text, payload.timestamp, payload.user === myUsername);
      } catch(e) {}
    };

    ws.onerror = ()=>{
      connected = false;
      statusDot.classList.add('off');
      statusText.textContent = 'Connection lost';
      sendBtn.disabled = true;
    };

    ws.onclose = ()=>{
      connected = false;
      statusDot.classList.add('off');
      statusText.textContent = 'Reconnecting…';
      sendBtn.disabled = true;
      setTimeout(connect, 3000);
    };
  }

  function sendMessage(){
    const text = input.value.trim();
    if(!text || !connected) return;

    // Check for blocked content
    const blocked = findBlockedContent(text);
    if(blocked){
      showBlockedWarning(blocked);
      return;
    }

    const payload = {
      user: myUsername,
      text: text,
      timestamp: Date.now()
    };

    fetch(`https://ntfy.sh/${TOPIC}`, {
      method: 'POST',
      body: JSON.stringify(payload)
    }).catch(()=>{});

    addMessage(myUsername, text, Date.now(), true);
    lockUsername();
    input.value = '';
    autoResize();
  }

  function addMessage(user, text, timestamp, isSelf){
    if(emptyState) emptyState.style.display = 'none';

    const msg = document.createElement('div');
    msg.className = 'msg' + (isSelf ? ' self' : '');

    const time = new Date(timestamp);
    const timeStr = time.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

    msg.innerHTML = `
      <div class="msg-header">
        <span class="msg-user">${escapeHtml(user)}</span>
        <span class="msg-time">${timeStr}</span>
      </div>
      <div class="msg-text">${escapeHtml(text)}</div>
    `;

    chat.insertBefore(msg, typing);
    chat.scrollTop = chat.scrollHeight;
  }

  function addSystemMessage(text){
    if(emptyState) emptyState.style.display = 'none';
    const msg = document.createElement('div');
    msg.className = 'msg system';
    msg.textContent = text;
    chat.insertBefore(msg, typing);
  }

  function showBlockedWarning(reason){
    const msg = document.createElement('div');
    msg.className = 'msg blocked';
    msg.textContent = `Message blocked: contains ${reason === 'website link' ? 'a website link' : 'restricted language'}`;
    chat.insertBefore(msg, typing);
    chat.scrollTop = chat.scrollHeight;

    // Flash the input border red
    input.classList.add('blocked-flash');
    setTimeout(()=> input.classList.remove('blocked-flash'), 500);
  }

  function showTyping(user){
    if(user === myUsername) return;
    typing.classList.add('show');
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(()=> typing.classList.remove('show'), 3000);
  }

  function hideTyping(){
    typing.classList.remove('show');
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  /* ===== Input handling ===== */
  function autoResize(){
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  }

  input.addEventListener('input', ()=>{
    autoResize();
    if(connected && input.value.trim()){
      const payload = { type:'typing', user:myUsername, timestamp:Date.now() };
      fetch(`https://ntfy.sh/${TOPIC}`, {
        method: 'POST',
        body: JSON.stringify(payload)
      }).catch(()=>{});
    }
  });

  input.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  connect();
  input.focus();
</script>

</body>
</html>
