<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verde — Doomscroller</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--space:#04060f;--ink:#eef2ff;--muted:#8590b8;--accent:#4caf50;--accent-2:#76e03f;--line:rgba(255,255,255,.08)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Space Grotesk',sans-serif;background:var(--space);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none}
  .star{position:absolute;width:1px;height:1px;background:#fff;border-radius:50%;opacity:.4}
  @keyframes twinkle{0%,100%{opacity:.1}50%{opacity:.6}}
  header{position:relative;z-index:10;padding:16px 28px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);background:rgba(4,6,15,.7);backdrop-filter:blur(12px)}
  .header-left{display:flex;align-items:center;gap:16px}
  .back-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;background:transparent;border:1px solid var(--line);color:var(--muted);text-decoration:none;font-size:13px;transition:.2s}
  .back-btn:hover{border-color:var(--accent);color:var(--accent)}
  .planet-title{font-family:'Fraunces',serif;font-size:22px;font-weight:700}
  .planet-title .dot{color:var(--accent)}
  .scroll-hint{font-size:12px;color:var(--muted)}
  #feed{position:relative;z-index:5;flex:1;overflow-y:scroll;scroll-snap-type:y mandatory;display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:20px}
  #feed::-webkit-scrollbar{width:0}
  .feed-item{scroll-snap-align:center;flex:0 0 auto;display:flex;justify-content:center;width:100%}
  .feed-card{max-width:420px;width:90%;border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);background:#0a0e1c;border:1px solid var(--line)}
  .feed-card img, .feed-card video{display:block;width:100%;max-height:70vh;object-fit:cover;background:#000}
  .feed-meta{padding:12px 16px;display:flex;flex-direction:column;gap:4px}
  .feed-meta .title{font-size:14px;line-height:1.4;color:var(--ink)}
  .feed-meta .sub{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
  .feed-meta .sub a{color:var(--accent-2);text-decoration:none}
  .skeleton{max-width:420px;width:90%;height:50vh;border-radius:16px;background:linear-gradient(90deg,#0a0e1c 25%,#121834 37%,#0a0e1c 63%);background-size:400% 100%;animation:shimmer 1.4s infinite}
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
  .end-card{scroll-snap-align:center;flex:0 0 auto;display:grid;place-items:center;min-height:60vh;text-align:center;color:var(--muted)}
  .end-card h3{font-family:'Fraunces',serif;font-size:28px;color:var(--ink);margin-bottom:8px}
  @media(max-width:500px){.feed-card{width:100%;border-radius:0}}
</style>
</head>
<body>
<div id="stars"></div>
<header>
  <div class="header-left">
    <a href="../index.html" class="back-btn">← Cosmos</a>
    <div class="planet-title">Verde<span class="dot">.</span></div>
  </div>
  <div class="scroll-hint">Scroll to feed your soul 🌿</div>
</header>
<div id="feed"></div>
<div id="loader" style="position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:20;font-size:12px;color:var(--muted);opacity:0;transition:opacity .3s;">loading more…</div>
<script>
  (function(){for(let i=0;i<120;i++){const s=document.createElement('div');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animation=`twinkle ${2+Math.random()*4}s infinite ${Math.random()*4}s`;document.getElementById('stars').appendChild(s)}})();

  // ---- Feed source: pulls real posts from Reddit's public JSON API. No manual input, ever. ----
  // Change this to any subreddit and it just works.
  const SUBREDDIT = 'NatureIsFuckingLit';
  const SORT = 'hot'; // 'hot' | 'top' | 'new'

  const feed = document.getElementById('feed');
  const loader = document.getElementById('loader');
  let after = null;        // reddit's pagination cursor
  let exhausted = false;
  let loading = false;

  // Fetches Reddit data through our own Vercel serverless function (/api/reddit.js),
  // which does the request server-side — no browser CORS issue, no dependency on
  // flaky public proxies.
  async function fetchJsonViaProxies(){
    const params = new URLSearchParams({ subreddit: SUBREDDIT, sort: SORT });
    if (after) params.set('after', after);
    const res = await fetch(`/api/reddit?${params.toString()}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }

  function decode(url){ return url.replace(/&amp;/g, '&'); }

  function extractMedia(d){
    if (d.over_18) return null; // keep it safe-for-work
    if (d.is_video && d.media && d.media.reddit_video && d.media.reddit_video.fallback_url) {
      return { type: 'video', src: decode(d.media.reddit_video.fallback_url) };
    }
    if (d.post_hint === 'image' && d.url) {
      return { type: 'image', src: decode(d.url) };
    }
    if (d.is_gallery && d.media_metadata) {
      const first = Object.values(d.media_metadata)[0];
      if (first && first.s && first.s.u) return { type: 'image', src: decode(first.s.u) };
    }
    return null;
  }

  function renderCard(d){
    const media = extractMedia(d);
    if (!media) return null;
    const wrap = document.createElement('div');
    wrap.className = 'feed-item';
    const mediaEl = media.type === 'video'
      ? `<video src="${media.src}" muted loop autoplay playsinline controls></video>`
      : `<img src="${media.src}" loading="lazy" alt="">`;
    wrap.innerHTML = `
      <div class="feed-card">
        ${mediaEl}
        <div class="feed-meta">
          <div class="title">${d.title}</div>
          <div class="sub">
            <span>r/${d.subreddit} · u/${d.author}</span>
            <a href="https://www.reddit.com${d.permalink}" target="_blank">open ↗</a>
          </div>
        </div>
      </div>`;
    return wrap;
  }

  function appendEndCard(){
    const end = document.createElement('div');
    end.className = 'end-card';
    end.innerHTML = `<div><h3>The canopy goes quiet.</h3><p>You've reached the edge of the forest.</p></div>`;
    feed.appendChild(end);
  }

  async function loadMore(){
    if (loading || exhausted) return;
    loading = true;
    loader.style.opacity = '1';
    try {
      const json = await fetchJsonViaProxies();
      const children = (json && json.data && json.data.children) || [];
      after = (json && json.data && json.data.after) || null;

      const frag = document.createDocumentFragment();
      let added = 0;
      children.forEach(c => {
        const card = renderCard(c.data);
        if (card) { frag.appendChild(card); added++; }
      });
      feed.appendChild(frag);

      if (!after || added === 0) {
        exhausted = true;
        if (!feed.querySelector('.end-card')) appendEndCard();
      }
      observeLast();
    } catch (err) {
      console.error('Feed load failed', err);
      if (!feed.querySelector('.end-card')) {
        const errCard = document.createElement('div');
        errCard.className = 'end-card';
        errCard.innerHTML = `<div><h3>Signal lost.</h3><p>Couldn't reach the feed — check your connection and reload.</p></div>`;
        feed.appendChild(errCard);
      }
      exhausted = true;
    } finally {
      loading = false;
      setTimeout(() => { loader.style.opacity = '0'; }, 400);
    }
  }

  // initial load
  loadMore();

  // infinite scroll: watch the last item and fetch more as it nears view
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        io.unobserve(entry.target);
        loadMore();
      }
    });
  }, { root: feed, rootMargin: '600px' });

  function observeLast(){
    const items = feed.querySelectorAll('.feed-item');
    if (items.length) io.observe(items[items.length - 1]);
  }

  // ---- gentle auto-advance, so the feed scrolls itself like a real doomscroll ----
  let autoTimer = null;
  let userPaused = false;
  let pauseResumeTimer = null;

  function scrollToNext(){
    const items = Array.from(feed.querySelectorAll('.feed-item, .end-card'));
    const feedTop = feed.scrollTop;
    const next = items.find(el => el.offsetTop > feedTop + 20);
    if (next) {
      feed.scrollTo({ top: next.offsetTop, behavior: 'smooth' });
    }
  }

  function startAutoScroll(){
    stopAutoScroll();
    autoTimer = setInterval(() => {
      if (!userPaused) scrollToNext();
    }, 6000);
  }
  function stopAutoScroll(){
    if (autoTimer) clearInterval(autoTimer);
  }

  function markUserActive(){
    userPaused = true;
    clearTimeout(pauseResumeTimer);
    pauseResumeTimer = setTimeout(() => { userPaused = false; }, 8000);
  }
  feed.addEventListener('wheel', markUserActive, { passive: true });
  feed.addEventListener('touchstart', markUserActive, { passive: true });
  feed.addEventListener('touchmove', markUserActive, { passive: true });

  startAutoScroll();
</script>
</body>
</html>
