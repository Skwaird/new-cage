<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aquas — AI Interface</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--space:#04060f;--ink:#eef2ff;--muted:#8590b8;--accent:#2196f3;--accent-2:#7ee8fa;--line:rgba(255,255,255,.08)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Space Grotesk',sans-serif;background:var(--space);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none}
  .star{position:absolute;width:1px;height:1px;background:#fff;border-radius:50%;opacity:.5}
  @keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.8}}
  header{position:relative;z-index:10;padding:16px 28px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);background:rgba(4,6,15,.7);backdrop-filter:blur(12px)}
  .header-left{display:flex;align-items:center;gap:16px}
  .back-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;background:transparent;border:1px solid var(--line);color:var(--muted);text-decoration:none;font-size:13px;transition:.2s}
  .back-btn:hover{border-color:var(--accent);color:var(--accent)}
  .planet-title{font-family:'Fraunces',serif;font-size:22px;font-weight:700}
  .planet-title .dot{color:var(--accent)}
  .key-badge{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:8px;background:rgba(33,150,243,.1);border:1px solid rgba(33,150,243,.25);font-size:12px}
  .key-badge .label{color:var(--muted)}
  .key-badge .status{color:var(--accent);font-weight:600}
  .key-badge.no-key .status{color:var(--muted)}
  #chat{position:relative;z-index:5;flex:1;overflow-y:auto;padding:24px 28px;display:flex;flex-direction:column;gap:14px}
  .msg{max-width:75%;padding:14px 18px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);animation:msgIn .3s ease;word-wrap:break-word}
  @keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .msg.user{align-self:flex-end;background:rgba(33,150,243,.08);border-color:rgba(33,150,243,.2)}
  .msg.ai{align-self:flex-start}
  .msg-role{font-size:12px;font-weight:600;margin-bottom:4px;font-family:'Fraunces',serif}
  .msg.user .msg-role{color:var(--accent)}
  .msg.ai .msg-role{color:var(--accent-2)}
  .msg-text{font-size:14px;line-height:1.6}
  .msg-text pre{background:rgba(0,0,0,.3);padding:10px;border-radius:8px;overflow-x:auto;margin:8px 0;font-size:13px}
  .msg-text code{font-family:monospace;font-size:13px}
  .typing{align-self:flex-start;padding:14px 18px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);display:none;align-items:center;gap:4px}
  .typing.show{display:flex}
  .typing-dot{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:tb 1.4s infinite}
  .typing-dot:nth-child(2){animation-delay:.2s}
  .typing-dot:nth-child(3){animation-delay:.4s}
  @keyframes tb{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
  .empty{text-align:center;margin:auto;color:var(--muted)}
  .empty h3{font-family:'Fraunces',serif;font-size:24px;color:var(--ink);margin-bottom:8px}
  .input-bar{position:relative;z-index:10;padding:16px 28px;border-top:1px solid var(--line);background:rgba(4,6,15,.7);backdrop-filter:blur(12px)}
  .input-wrap{display:flex;gap:12px;max-width:800px;margin:0 auto}
  #input{flex:1;padding:14px 18px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--ink);font-family:inherit;font-size:14px;resize:none;outline:none;max-height:120px;min-height:48px;line-height:1.5}
  #input:focus{border-color:var(--accent)}
  #send{padding:14px 24px;border-radius:12px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--accent),#0d47a1);color:#fff;font-family:inherit;font-weight:600;font-size:14px;transition:.2s}
  #send:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(33,150,243,.3)}
  #send:disabled{opacity:.4;cursor:not-allowed;transform:none}
</style>
</head>
<body>
<div id="stars"></div>
<header>
  <div class="header-left">
    <a href="../index.html" class="back-btn">← Cosmos</a>
    <div class="planet-title">Aquas<span class="dot">.</span></div>
  </div>
  <div class="key-badge no-key" id="key-badge">
    <span class="label">API Key:</span>
    <span class="status" id="key-status">Not set</span>
  </div>
</header>
<div id="chat">
  <div class="empty" id="empty">
    <h3>The waters are still.</h3>
    <p>Ask anything. The tide will answer.</p>
  </div>
  <div class="typing" id="typing"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>
</div>
<div class="input-bar">
  <div class="input-wrap">
    <textarea id="input" placeholder="Ask the tide…" rows="1"></textarea>
    <button id="send" disabled>Send</button>
  </div>
</div>
<script>
  (function(){for(let i=0;i<150;i++){const s=document.createElement('div');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animation=`twinkle ${2+Math.random()*4}s infinite ${Math.random()*4}s`;document.getElementById('stars').appendChild(s)}})();

  // ==========================================
  //  PUT YOUR API KEY HERE
  // ==========================================
  const API_KEY = '';
  // ==========================================
  //  Uses OpenAI-compatible chat completions API
  //  Change BASE_URL if using a different provider
  // ==========================================
  const BASE_URL = 'https://api.openai.com/v1/chat/completions';
  const MODEL = 'gpt-4o-mini';

  const chat = document.getElementById('chat');
  const empty = document.getElementById('empty');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  const typing = document.getElementById('typing');
  const keyBadge = document.getElementById('key-badge');
  const keyStatus = document.getElementById('key-status');

  let messages = [];

  if(API_KEY){
    keyBadge.classList.remove('no-key');
    keyStatus.textContent = 'Active';
    send.disabled = false;
  } else {
    keyStatus.textContent = 'Set API_KEY in source';
  }

  function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

  function addMessage(role, text){
    if(empty) empty.style.display='none';
    const msg = document.createElement('div');
    msg.className = 'msg ' + (role==='user'?'user':'ai');
    const roleLabel = role==='user'?'You':'Aquas';
    // Basic markdown: code blocks and inline code
    let html = escapeHtml(text);
    html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (m,lang,code)=>`<pre><code>${code.trim()}</code></pre>`);
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    msg.innerHTML = `<div class="msg-role">${roleLabel}</div><div class="msg-text">${html}</div>`;
    chat.insertBefore(msg, typing);
    chat.scrollTop = chat.scrollHeight;
  }

  async function sendMessage(){
    const text = input.value.trim();
    if(!text || !API_KEY) return;

    addMessage('user', text);
    messages.push({role:'user', content:text});
    input.value = '';
    input.style.height = 'auto';
    typing.classList.add('show');

    try {
      const res = await fetch(BASE_URL, {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'Authorization':`Bearer ${API_KEY}`
        },
        body:JSON.stringify({
          model:MODEL,
          messages:[
            {role:'system', content:'You are Aquas, a mysterious and wise AI entity dwelling in an ocean at the edge of the universe. Be helpful but maintain a slightly ethereal, poetic tone. Keep responses concise unless asked for detail.'},
            ...messages
          ]
        })
      });

      const data = await res.json();
      typing.classList.remove('show');

      if(data.error){
        addMessage('ai', `⚠ Error: ${data.error.message || 'Unknown error'}`);
        return;
      }

      const reply = data.choices?.[0]?.message?.content || '...the tide returns nothing.';
      addMessage('ai', reply);
      messages.push({role:'assistant', content:reply});
    } catch(e){
      typing.classList.remove('show');
      addMessage('ai', '⚠ The connection to the deep was lost. Check your API key or network.');
    }
  }

  input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,120)+'px'});
  input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
  send.addEventListener('click', sendMessage);
  input.focus();
</script>
</body>
</html>
